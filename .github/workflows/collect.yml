name: Collect events

on:
  workflow_dispatch:
    inputs:
      enable_legacy_collection:
        description: Publish legacy Midnight Watch event data
        type: boolean
        required: true
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ inputs.enable_legacy_collection == true }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      OUT_DIR: out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Load previous run's data
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:seen.json > out/seen.json 2>/dev/null || rm -f out/seen.json
          fi

      - run: node scripts/collect.mjs

      # The data branch holds a single commit that is replaced on every run.
      - name: Publish to data branch
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b data
          git add events.json seen.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update events"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
