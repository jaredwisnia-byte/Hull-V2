name: Trim QA regression tests

on:
  push:
    paths:
      - "long-lines/tools/propkit/trim_checks.py"
      - "long-lines/tests/test_trim_checks.py"
      - ".github/workflows/trim-qa.yml"
  pull_request:
    paths:
      - "long-lines/tools/propkit/trim_checks.py"
      - "long-lines/tests/test_trim_checks.py"
      - ".github/workflows/trim-qa.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image utilities
        run: python -m pip install "numpy>=1.26" "scipy>=1.11" "Pillow>=10"
      - name: Check Blender-side Python syntax
        run: python -m py_compile long-lines/tools/factory.py long-lines/tools/preview_trim.py long-lines/tools/propkit/extrude.py long-lines/tools/propkit/qa.py long-lines/tools/propkit/trim_checks.py
      - name: Run deterministic trim checks
        run: python -m unittest discover -s long-lines/tests -p 'test_trim_checks.py' -v
