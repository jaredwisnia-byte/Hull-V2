name: Hull software contracts

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * 1'

permissions:
  contents: read

concurrency:
  group: hull-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - name: Compile tool sources
        run: python -m compileall -q hull.py long-lines/tools
      - name: Core contracts and repository audit
        run: python hull.py check --profiles core --output .hull-maintenance/ci
      - name: Keep qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hull-core-${{ github.sha }}
          path: .hull-maintenance/ci/
          retention-days: 14
