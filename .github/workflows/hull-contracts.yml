name: Hull software contracts

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * 1'

permissions:
  contents: read

concurrency:
  group: hull-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - name: Compile tool sources
        run: python -m compileall -q hull.py long-lines/tools
      - name: Core contracts and repository audit
        run: python hull.py check --profiles core --output .hull-maintenance/ci
      - name: Keep qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hull-core-${{ github.sha }}
          path: .hull-maintenance/ci/
          retention-days: 14
